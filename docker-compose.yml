services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mahakaya_enterprise
      MYSQL_USER: mahakaya
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root_change_me
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  backend:
    build: .
    env_file: .env
    ports: ["5000:5000"]
    depends_on: [mysql]
volumes:
  mysql-data:
